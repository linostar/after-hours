    <path d="M17 33.6 Q22 36.6 28 35.6 Q34 36.6 39 33.6 L39 40 L17 40 Z" fill="#c99470" opacity="0.7"/>
    <ellipse cx="20.6" cy="20.6" rx="3" ry="1.4" transform="rotate(-20 20.6 20.6)" fill="#fbe2c8"/>
  </g>
  <circle cx="28" cy="24" r="12.6" fill="none" stroke="#141022" stroke-width="1.2"/>
