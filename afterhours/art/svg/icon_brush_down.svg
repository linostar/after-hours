<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f4f8f"/>
      <stop offset="0.45" stop-color="#5f84c9"/>
      <stop offset="1" stop-color="#22386a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d79a55"/>
      <stop offset="1" stop-color="#8a5126"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#2a2333" stroke="#c9a24a" stroke-width="3"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#c9a24a" stroke-opacity="0.35" stroke-width="1"/>
