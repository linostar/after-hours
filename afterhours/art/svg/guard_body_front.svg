  <!-- The jacket: a hard shadow down the right, a sheen down the left, a fold under the belly. -->
  <path d="M10.6 43.6 Q11.4 37.4 18 36.4 L38 36.4 Q44.6 37.4 45.4 43.6 Q47.8 55 46.6 67.6 Q28 72 9.4 67.6 Q8.2 55 10.6 43.6 Z" fill="#2f3d72"/>
