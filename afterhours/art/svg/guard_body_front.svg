  <circle cx="15.4" cy="25" r="2.6" fill="#e6b285" stroke="#141022" stroke-width="0.9"/>
  <circle cx="40.6" cy="25" r="2.6" fill="#c99470" stroke="#141022" stroke-width="0.9"/>
  <circle cx="28" cy="24" r="12.6" fill="#edc29a"/>
  <g clip-path="url(#head)">
