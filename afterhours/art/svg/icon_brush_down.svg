  <path d="M31 40 L32 19" stroke="#b07038" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 20.5 L32.2 15" stroke="#b9b2a4" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M32.2 15 Q31.4 11.5 32.6 10 Q33.8 11.6 33.2 14.8" fill="#f2c94c"/>
