  <path d="M20 36 L28 41.2 L36 36 L34.6 34.2 L21.4 34.2 Z" fill="#253065" stroke="#141022" stroke-width="1" stroke-linejoin="round"/>
  <path d="M22 35.6 L24.4 37.4 M34 35.6 L31.6 37.4" stroke="url(#gold)" stroke-width="1.1" stroke-linecap="round"/>
