  <path d="M19.2 31.4 Q23.6 28.4 28 30.4 Q32.4 28.4 36.8 31.4 Q34.6 33.8 31.4 33 Q29.6 33.8 28 32.6 Q26.4 33.8 24.6 33 Q21.4 33.8 19.2 31.4 Z" fill="#a39d97" stroke="#5e5853" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M22 31.2 L23 32.4 M25 30.6 L25.8 32 M31 30.6 L30.2 32 M34 31.2 L33 32.4" stroke="#77716b" stroke-width="0.5" stroke-linecap="round"/>
  <ellipse cx="28" cy="28.6" rx="2.7" ry="2.2" fill="#e09a74" stroke="#a96c48" stroke-width="0.6"/>
  <ellipse cx="27.2" cy="27.9" rx="0.9" ry="0.6" fill="#f6c7a6"/>
  <!-- The peaked cap: cel-shaded crown, a gold cord on the band, the star badge, the glossy peak. -->
  <path d="M13.4 18.4 Q14 5.6 28 5.2 Q42 5.6 42.6 18.4 Z" fill="#2a3566"/>
  <g clip-path="url(#cap)">
    <path d="M32 4 Q39 10 37.6 19 L44 19 L44 4 Z" fill="#18204a"/>
  </g>
  <path d="M17 12 Q21 7.6 28 7.4" stroke="#5262a0" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M13.4 18.4 Q14 5.6 28 5.2 Q42 5.6 42.6 18.4 Z" fill="none" stroke="#141022" stroke-width="1" stroke-linejoin="round"/>
  <rect x="13" y="15.6" width="30" height="4.4" fill="#141a30" stroke="#141022" stroke-width="0.8"/>
  <path d="M13.6 17.8 L42.4 17.8" stroke="#d9b452" stroke-width="0.8"/>
  <path d="M28 8.6 L29.2 11.4 L32.2 11.6 L29.9 13.4 L30.7 16.3 L28 14.7 L25.3 16.3 L26.1 13.4 L23.8 11.6 L26.8 11.4 Z" fill="url(#gold)" stroke="#7d5a1c" stroke-width="0.5"/>
