  <circle cx="33" cy="25.8" r="1.6" fill="#141022"/>
  <circle cx="23.5" cy="25.2" r="0.5" fill="#ffffff"/>
  <circle cx="33.5" cy="25.2" r="0.5" fill="#ffffff"/>
  <path d="M19.8 25.4 L18.6 24.8 M19.8 26.4 L18.6 26.8 M36.2 25.4 L37.4 24.8 M36.2 26.4 L37.4 26.8" stroke="#b07a55" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="19.6" cy="29.6" r="2" fill="#e07a6a" opacity="0.45"/>
  <circle cx="36.4" cy="29.6" r="2" fill="#e07a6a" opacity="0.45"/>
